<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cast Voices · Art of War</title>
<style>
:root { --bg: #0b1220; --panel: #121c30; --panel2: #18243c; --line: #26365a; --text: #e6ecf8; --dim: #8fa0c0; --gold: #ffd36a; --blue: #6ad0ff; --green: #6fdc8c; --red: #ff6a6a; --mono: ui-monospace, Menlo, Consolas, monospace; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; height: 100vh; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: #0e1628; flex-wrap: wrap; }
header b { color: var(--gold); letter-spacing: .06em; }
header .sp { flex: 1; }
button, select, input, textarea { font: inherit; color: var(--text); }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--blue); }
button.pri { background: #1d5b3a; border-color: #2f8f5c; }
button.warn { background: #5b1d1d; border-color: #8f2f2f; }
button.sm { padding: 3px 8px; font-size: 12px; }
button:disabled { opacity: .45; cursor: default; }
select, input[type=text], input[type=number], textarea { background: #0c1528; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
textarea { width: 100%; resize: vertical; min-height: 38px; }
.layout { flex: 1; display: flex; min-height: 0; }
nav { width: 290px; border-right: 1px solid var(--line); overflow-y: auto; padding: 8px; background: #0d1527; flex: none; }
nav h4 { margin: 14px 6px 4px; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .1em; }
nav a { display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; border-radius: 6px; color: var(--text); text-decoration: none; cursor: pointer; }
nav a:hover { background: var(--panel2); }
nav a.on { background: #1b2d4d; color: var(--gold); }
nav a small { color: var(--dim); font-family: var(--mono); }
nav a.edited span::after { content: " ●"; color: var(--gold); font-size: 10px; }
main { flex: 1; overflow-y: auto; padding: 18px 22px 60px; }
h2 { margin: 0 0 4px; color: var(--gold); font-size: 20px; }
.when { color: var(--blue); margin-bottom: 14px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); margin-bottom: 8px; }
.row .who { font: 700 11px var(--mono); color: var(--blue); margin-bottom: 3px; }
.row .orig { font-size: 12px; color: var(--dim); margin-top: 4px; }
.row .orig s { color: #6f7f9f; }
.row .btns { display: flex; flex-direction: column; gap: 4px; }
.row.changed { border-color: #6b5a2a; }
.tools { display: flex; gap: 8px; margin: 10px 0 16px; flex-wrap: wrap; }
.note { color: var(--dim); font-size: 13px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
.grid { display: grid; grid-template-columns: 150px 1fr 60px; gap: 8px 12px; align-items: center; }
.grid label { color: var(--dim); }
.grid input[type=range] { width: 100%; accent-color: var(--blue); }
.grid .v { font-family: var(--mono); text-align: right; }
.bar { height: 10px; background: #0c1528; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2f8f5c, #6ad0ff); transition: width .3s; }
.log { font: 12px var(--mono); color: var(--dim); white-space: pre-wrap; max-height: 160px; overflow: auto; background: #0a1222; border-radius: 6px; padding: 8px; margin-top: 8px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; background: #1b2d4d; font-size: 12px; color: var(--blue); }
.packs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.packs button.on { border-color: var(--gold); color: var(--gold); }
#toast { position: fixed; right: 16px; bottom: 16px; background: #1d5b3a; border: 1px solid #2f8f5c; padding: 10px 14px; border-radius: 8px; display: none; max-width: 420px; }
#toast.err { background: #5b1d1d; border-color: #8f2f2f; }

.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 16px; text-align: center; color: var(--dim); margin-bottom: 14px; }
.drop.over, .row.over { border-color: var(--gold); background: #1b2d4d; }
.row .id { font: 700 11px var(--mono); color: var(--dim); }
.row .st { font-size: 12px; margin-top: 4px; }
.row .st.ok { color: var(--green); } .row .st.no { color: var(--red); }
.btns { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
input[type=search] { background: #0c1528; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; width: 220px; }
</style>
</head>
<body>
<header>
  <b>🎤 CAST VOICES</b><span class="note" id="total">Loading…</span>
  <span class="sp"></span>
  <input type="search" id="q" placeholder="Search lines or IDs">
  <label class="note"><input type="checkbox" id="miss"> Missing only</label>
  <a href="/script"><button>🎙 Script Studio</button></a>
  <a href="/dev.html"><button>📦 Asset Studio</button></a>
  <a href="/" target="_blank"><button>🎮 Play</button></a>
</header>
<div class="layout"><nav id="nav"></nav><main id="main"><p class="note">Loading…</p></main></div>
<div id="toast"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let CR = { chars: {} }, FX = { chars: {} }, RADIO = new Map(), AC = null, SRC = null, L = [], HAVE = {}, who = null, audio = null, ver = Date.now();
const toast = (t, err) => { const e = $('toast'); e.textContent = t; e.className = err ? 'err' : ''; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => { e.style.display = 'none'; }, 3500); };
async function load() { const r = await fetch('/api/castvo'); const j = await r.json(); L = j.lines; HAVE = j.have; FX = j.fx || { chars: {} }; RADIO = new Map(Object.entries(j.radio || {})); try { CR = await (await fetch('/api/castvo/credits')).json(); } catch (_) {} if (!who && L.length) who = L[0].character; render(); }
const chars = () => { const m = new Map(); for (const l of L) { const c = m.get(l.character) || { n: 0, h: 0 }; c.n++; if (HAVE[l.line_id]) c.h++; m.set(l.character, c); } return m; };
function render() {
  const C = chars(), done = L.filter(l => HAVE[l.line_id]).length; $('total').textContent = `${done} of ${L.length} lines recorded · ${C.size} characters`;
  let nav = '<h4>Characters</h4>'; for (const [c, v] of C) nav += `<a class="${c === who ? 'on' : ''}" data-c="${esc(c)}"><span>${v.h === v.n ? '✅ ' : ''}${esc(c)}${CR.chars[c] ? ' 🎙' : ''}</span><small>${v.h}/${v.n}</small></a>`;
  $('nav').innerHTML = nav; $('nav').querySelectorAll('a').forEach(a => a.onclick = () => { who = a.dataset.c; $('q').value = ''; render(); $('main').scrollTop = 0; });
  const q = $('q').value.trim().toLowerCase(), miss = $('miss').checked;
  const rows = L.filter(l => (q ? (l.line + ' ' + l.line_id + ' ' + l.character).toLowerCase().includes(q) : l.character === who) && (!miss || !HAVE[l.line_id]));
  const lead = q ? `Search: “${esc(q)}”` : esc(who || ''), first = L.find(l => l.character === who);
  let h = `<h2>${lead}</h2>${!q && first ? `<div class="when">${esc(first.actor || '')} · 📻 Radio <select id="rp"><option value="">Off (normal voice)</option>${Object.entries(RADIO_FX).map(([k, v]) => `<option value="${k}" ${cf().p === k ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select>
      Strength <input type="range" id="ra" min="0" max="150" step="5" value="${Math.round((cf().a == null ? 1 : cf().a) * 100)}" style="vertical-align:middle;accent-color:var(--gold)"> <span id="rav">${Math.round((cf().a == null ? 1 : cf().a) * 100)}%</span>
      <button class="sm" id="rprev">▶ Preview</button></div>
    <div class="when">🎙 Voice actor <input type="text" id="vn" placeholder="Name for the credits" value="${esc((CR.chars[who] || {}).name || '')}" style="width:190px"> Email or website <input type="text" id="vc" placeholder="optional, so people can hire them" value="${esc((CR.chars[who] || {}).contact || '')}" style="width:230px"> <button class="sm pri" id="vsave">💾 Save credit</button></div>` : ''}
    <div class="tools"><button class="sm" id="crbatch">📝 Paste a batch of credits</button><button class="sm" id="pickmany">📂 Choose mp3 files</button></div>
    <div id="crbox" style="display:none;margin-bottom:12px"><textarea id="crtext" rows="6" style="width:100%" placeholder="One per line, in any order: character (or a line ID), actor name, email or website&#10;Lt. Sela, Jane Doe, jane@example.com&#10;SERGEANT_ROCCO_001	John Smith	johnsmith.com"></textarea><div class="tools" style="margin:6px 0 0"><button class="sm pri" id="crgo">Assign</button><span class="note">Lines that don't name a character are skipped. Saving rebuilds the game and updates docs/voice_credits.md.</span></div></div>
    <div class="drop" id="drop">Drop mp3 files here, named by line ID (like <b>${esc((rows[0] || L[0] || {}).line_id || 'B_U_R_P_001')}.mp3</b>). Any number at once, from any character.<br>Or drop one file onto a single line below.</div>
    <div class="tools"><button id="playall">▶ Play every recorded line here</button><button id="stop">■ Stop</button><span class="note">To test in the game: press Play, go to the character and talk. Recorded lines play instead of the babble (Settings → Sound → Voice must be on).</span></div>`;
  for (const l of rows) { const has = HAVE[l.line_id];
    h += `<div class="row" data-id="${l.line_id}"><div><div class="id">${l.line_id} · ${esc(l.character)}${RADIO.has(l.line_id) ? ' · 📻 ' + esc((RADIO_FX[RADIO.get(l.line_id)[0]] || {}).name || '') : ''} <button class="sm" data-a="copy" title="Copy the line ID (for the file or label name)">📋 Copy ID</button></div><div class="txt">${esc(l.line)} <button class="sm" data-a="edit" title="Change the words (the game shows the new text)">✏ Edit</button></div>${l.original ? `<div class="orig">Original: <s>${esc(l.original)}</s></div>` : ''}<div class="orig">${esc(l.when_it_plays || '')} · ${esc(l.source || '')}</div>
      <div class="st ${has ? 'ok' : 'no'}">${has ? '● recorded · ' + Math.round(has / 1024) + ' KB' : '○ not recorded'}</div></div>
      <div class="btns">${has ? '<button class="sm" data-a="play">▶ Play</button>' : ''}<button class="sm" data-a="up">⬆ ${has ? 'Replace' : 'Upload'}</button>${has ? '<button class="sm warn" data-a="del">✕</button>' : ''}</div></div>`; }
  if (!rows.length) h += '<p class="note">Nothing here.</p>';
  $('main').innerHTML = h; wire(rows); }
// helmet radio presets (same code in cast.html and src/castvo.js). amt is the strength slider: 0 = clean, 1 = the preset, up to 1.5 = extra crunchy
const RADIO_FX = {
  helmet: { name: 'Helmet (light)', hp: 300, lp: 3600, pf: 1800, pg: 4, drive: 2.2, stat: 0.012, sq: 0.08, dry: 0.18, box: 0 },
  comms: { name: 'Clean comms', hp: 250, lp: 5200, pf: 2500, pg: 2, drive: 1.3, stat: 0.004, sq: 0.05, dry: 0.3, box: 0 },
  visor: { name: 'Closed visor', hp: 180, lp: 3000, pf: 900, pg: 3, drive: 1.6, stat: 0.005, sq: 0.04, dry: 0.25, box: 0.28 },
  oldradio: { name: 'Old radio', hp: 500, lp: 2800, pf: 1500, pg: 6, drive: 4, stat: 0.03, sq: 0.12, dry: 0.05, box: 0 },
  longrange: { name: 'Long range', hp: 650, lp: 2400, pf: 1600, pg: 7, drive: 5.5, stat: 0.05, sq: 0.15, dry: 0, box: 0 },
  robot: { name: 'Robot speaker', hp: 350, lp: 4200, pf: 1200, pg: 5, drive: 3, stat: 0.006, sq: 0.03, dry: 0.15, box: 0.45 }
};
function radioPlay(ac, buf, dest, vol, preset, amt) {
  const P = RADIO_FX[preset] || RADIO_FX.helmet, k = Math.max(0, Math.min(1.5, amt == null ? 1 : amt)), mix = Math.min(1, k);
  const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 20 + (P.hp - 20) * mix; hp.Q.value = 0.7;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 16000 - (16000 - P.lp) * mix; lp.Q.value = 0.8;
  const pk = ac.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = P.pf; pk.gain.value = P.pg * k; pk.Q.value = 1;
  const dr = 1 + (P.drive - 1) * k, sh = ac.createWaveShaper(), cv = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 511.5 - 1; cv[i] = Math.tanh(x * dr) / Math.tanh(dr); } sh.curve = cv;
  const wet = ac.createGain(), dry = ac.createGain(), out = ac.createGain(); wet.gain.value = 0.85 * mix + 0.0; dry.gain.value = 1 - mix * (1 - P.dry); out.gain.value = vol;
  const s = ac.createBufferSource(); s.buffer = buf; s.connect(hp); hp.connect(lp); lp.connect(pk); pk.connect(sh); sh.connect(wet); s.connect(dry); wet.connect(out); dry.connect(out); out.connect(dest);
  if (P.box) { const d = ac.createDelay(0.1), fb = ac.createGain(), bg = ac.createGain(); d.delayTime.value = 0.011; fb.gain.value = P.box * mix; bg.gain.value = 0.5 * mix; sh.connect(d); d.connect(fb); fb.connect(d); d.connect(bg); bg.connect(out); }
  const t0 = ac.currentTime + 0.06, end = t0 + buf.duration, nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const nz = ac.createBufferSource(); nz.buffer = nb; nz.loop = true; const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2600; bp.Q.value = 0.6; const ng = ac.createGain(); ng.gain.value = 0;
  nz.connect(bp); bp.connect(ng); ng.connect(out); const st = P.stat * k, sq = P.sq * k;
  const g = ng.gain; g.setValueAtTime(0, ac.currentTime); g.linearRampToValueAtTime(sq, ac.currentTime + 0.01); g.linearRampToValueAtTime(st, t0); g.setValueAtTime(st, end); g.linearRampToValueAtTime(sq, end + 0.02); g.linearRampToValueAtTime(0, end + 0.1);
  nz.start(); nz.stop(end + 0.12); s.start(t0); s.onended = () => { try { nz.stop(); } catch (_) {} };
  return s; }
const cf = () => (FX.chars && FX.chars[who]) || {};
function stopAll() { if (audio) audio.pause(); try { if (SRC) SRC.stop(); } catch (_) {} SRC = null; }
function playId(id, over) { stopAll(); const rf = over !== undefined ? over : RADIO.get(id); if (!rf) return new Promise(ok => { audio = new Audio('/voice/cast/' + id + '.mp3?v=' + ver); audio.onended = audio.onerror = ok; audio.play().catch(ok); });
  AC = AC || new AudioContext(); return fetch('/voice/cast/' + id + '.mp3?v=' + ver).then(r => r.arrayBuffer()).then(a => AC.decodeAudioData(a)).then(buf => new Promise(ok => { SRC = radioPlay(AC, buf, AC.destination, 1, rf[0], rf[1]); SRC.onended = ok; })).catch(() => {}); }
async function upload(id, file) { const r = await fetch('/api/castvo/upload?id=' + encodeURIComponent(id), { method: 'POST', headers: { 'Content-Type': 'audio/mpeg' }, body: file }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'upload failed'); HAVE[id] = j.size; ver = Date.now(); }
// finds a line ID anywhere in the file name, so Audacity's '01-LT_SELA_001.mp3' or 'LT_SELA_001 take2.mp3' still match
const idFromName = n => { const base = n.replace(/\.mp3$/i, '').toUpperCase(), ids = new Set(L.map(l => l.line_id)); if (ids.has(base)) return base; for (const m of base.matchAll(/[A-Z0-9][A-Z0-9_]*?_\d{3}(?!\d)/g)) { let t = m[0]; while (t) { if (ids.has(t)) return t; const k = t.indexOf('_'); if (k < 0) break; t = t.slice(k + 1); } } return null; };
async function bulk(files) { let ok = 0; const bad = [];
  for (const f of files) { const id = idFromName(f.name); if (!id || !/\.mp3$/i.test(f.name)) { bad.push(f.name); continue; } try { toast(`Uploading ${f.name}…`); await upload(id, f); ok++; } catch (e) { bad.push(f.name + ' (' + e.message + ')'); } }
  render(); toast(`${ok} uploaded` + (bad.length ? ` · ${bad.length} skipped (no line ID in the name): ${bad.slice(0, 4).join(', ')}${bad.length > 4 ? '…' : ''}` : ''), !ok); }
function pick(cb) { const i = document.createElement('input'); i.type = 'file'; i.accept = '.mp3,audio/mpeg'; i.onchange = () => i.files[0] && cb(i.files[0]); i.click(); }
function wire(rows) {
  const d = $('drop'); ['dragenter', 'dragover'].forEach(e => d.addEventListener(e, ev => { ev.preventDefault(); d.classList.add('over'); }));
  d.addEventListener('dragleave', () => d.classList.remove('over')); d.addEventListener('drop', ev => { ev.preventDefault(); d.classList.remove('over'); bulk([...ev.dataTransfer.files]); });
  document.querySelectorAll('.row').forEach(r => { const id = r.dataset.id;
    r.addEventListener('dragover', ev => { ev.preventDefault(); r.classList.add('over'); }); r.addEventListener('dragleave', () => r.classList.remove('over'));
    r.addEventListener('drop', async ev => { ev.preventDefault(); ev.stopPropagation(); r.classList.remove('over'); const f = ev.dataTransfer.files[0]; if (!f) return; try { await upload(id, f); render(); toast('Saved ' + id); } catch (e) { toast(e.message, 1); } });
    r.querySelectorAll('button').forEach(b => b.onclick = async () => { const a = b.dataset.a;
      if (a === 'copy') { navigator.clipboard.writeText(id).then(() => toast('Copied ' + id), () => { const t = document.createElement('textarea'); t.value = id; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); toast('Copied ' + id); }); return; }
      if (a === 'edit') { const l = L.find(x => x.line_id === id), box = r.querySelector('.txt');
        box.innerHTML = `<textarea rows="2">${esc(l.line)}</textarea><div class="tools" style="margin:6px 0 0"><button class="sm pri" data-e="save">💾 Save</button><button class="sm" data-e="cancel">Cancel</button>${l.original ? '<button class="sm warn" data-e="reset">Back to original</button>' : ''}<span class="note">Saving rebuilds the game, so give it a few seconds.</span></div>`;
        const ta = box.querySelector('textarea'); ta.focus();
        const put = async text => { toast('Saving and rebuilding…'); const rr = await fetch('/api/castvo/text', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, text }) }); const j = await rr.json().catch(() => ({})); if (!rr.ok) return toast(j.error || 'could not save', 1);
          l.line = j.line; if (j.original) l.original = j.original; else delete l.original; render(); toast(j.original ? 'Saved. The game shows the new words now (reload the game tab).' : 'Back to the original words.'); };
        box.querySelector('[data-e=save]').onclick = () => put(ta.value); box.querySelector('[data-e=cancel]').onclick = render; const rs = box.querySelector('[data-e=reset]'); if (rs) rs.onclick = () => put('');
        return; }
      if (a === 'play') playId(id);
      if (a === 'up') pick(async f => { try { await upload(id, f); render(); toast('Saved ' + id); } catch (e) { toast(e.message, 1); } });
      if (a === 'del' && confirm('Delete the recording for ' + id + '?')) { await fetch('/api/castvo/delete?id=' + encodeURIComponent(id), { method: 'POST' }); delete HAVE[id]; render(); toast('Deleted ' + id); } }); });
  $('pickmany').onclick = () => { const i = document.createElement('input'); i.type = 'file'; i.multiple = true; i.accept = '.mp3,audio/mpeg'; i.onchange = () => i.files.length && bulk([...i.files]); i.click(); };
  $('crbatch').onclick = () => { const b = $('crbox'); b.style.display = b.style.display === 'none' ? 'block' : 'none'; if (b.style.display === 'block') $('crtext').focus(); };
  $('crgo').onclick = async () => { toast('Saving credits and rebuilding…'); const r = await fetch('/api/castvo/credits', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: $('crtext').value }) }); const j = await r.json().catch(() => ({})); if (!r.ok) return toast(j.error || 'could not save', 1);
    CR = j.credits; render(); toast(`${j.assigned.length} assigned` + (j.skipped.length ? ` · ${j.skipped.length} skipped: ${j.skipped.slice(0, 3).join(' / ')}${j.skipped.length > 3 ? '…' : ''}` : ''), !j.assigned.length); };
  if ($('vsave')) $('vsave').onclick = async () => { toast('Saving credit and rebuilding…'); const r = await fetch('/api/castvo/credit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ character: who, name: $('vn').value, contact: $('vc').value }) }); const j = await r.json().catch(() => ({})); if (!r.ok) return toast(j.error || 'could not save', 1);
    CR = j.credits; render(); toast(CR.chars[who] ? `${who}: voiced by ${CR.chars[who].name}. It's in the game credits and docs/voice_credits.md` : `${who}: credit removed`); };
  $('playall').onclick = async () => { const ids = rows.filter(l => HAVE[l.line_id]).map(l => l.line_id); window._stop = false; for (const id of ids) { if (window._stop) break; document.querySelectorAll('.row').forEach(r => r.style.borderColor = r.dataset.id === id ? 'var(--gold)' : ''); await playId(id); } };
  $('stop').onclick = () => { window._stop = true; stopAll(); };
  const rp = $('rp'), ra = $('ra'); if (rp) { let tm = 0;
    const cur = () => rp.value ? [rp.value, ra.value / 100] : null;
    const save = async () => { const r = await fetch('/api/castvo/fx', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ character: who, p: rp.value || null, a: ra.value / 100 }) }); const j = await r.json(); if (!r.ok) return toast(j.error || 'could not save', 1); FX = j.fx; RADIO = new Map(Object.entries(j.radio || {})); toast(rp.value ? `${who}: ${RADIO_FX[rp.value].name}, ${ra.value}%` : `${who} sounds normal`); };
    const prev = () => { const l = rows.find(x => HAVE[x.line_id]); if (!l) return toast('Upload a line for this character first to hear it', 1); playId(l.line_id, cur()); };
    rp.onchange = async () => { await save(); render(); prev(); };
    ra.oninput = () => { $('rav').textContent = ra.value + '%'; clearTimeout(tm); tm = setTimeout(save, 500); };
    ra.onchange = prev; $('rprev').onclick = prev; } }
$('q').oninput = render; $('miss').onchange = render;
document.addEventListener('dragover', e => e.preventDefault()); document.addEventListener('drop', e => e.preventDefault());
load().catch(e => { $('main').innerHTML = '<p class="note">Could not reach the admin server. Start it with <b>node server.js</b> and open <b>localhost</b>/cast.</p>'; });
