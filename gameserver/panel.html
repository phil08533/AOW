<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blork Server</title>
<style>
:root{--bg:#0e1015;--card:#171a22;--line:#2a2f3c;--tx:#e6e8ef;--mut:#9aa3b5;--acc:#7dff6a;--bad:#ff6a5a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}header b{font-size:18px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}.off .dot{background:var(--bad);box-shadow:none}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;padding:16px;max-width:1100px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}.card h3{margin:0 0 10px;font-size:15px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}.row label{flex:0 0 130px;color:var(--mut)}.row input,.row select{flex:1;min-width:0;background:#0b0d12;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.big{font:700 26px ui-monospace,monospace;letter-spacing:.15em;color:var(--acc)}
button{background:#232838;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}button:hover{border-color:var(--acc)}
button.go{background:var(--acc);color:#071;border:0;font-weight:700}button.stop{background:var(--bad);color:#200;border:0;font-weight:700}
.addr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.addr code{color:#cfe}.mut{color:var(--mut);font-size:12px}
#log{height:180px;overflow:auto;background:#0b0d12;border-radius:6px;padding:8px;font:12px ui-monospace,monospace;white-space:pre-wrap}
table{width:100%;border-collapse:collapse}td{padding:5px 4px;border-bottom:1px solid var(--line)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#232838;padding:8px 14px;border-radius:6px;display:none}
</style></head><body>
<header id="hd"><span class="dot"></span><b>Blork Server</b><span id="sub" class="mut"></span><span style="flex:1"></span><button class="stop" id="stop">Stop server</button></header>
<main>
 <section class="card"><h3>Share this to let people join</h3>
  <div id="codeBox"><div class="mut">Join code</div><div class="big" id="code">…</div><button id="cpCode">Copy code</button></div>
  <div style="margin-top:12px" id="addrs"></div>
  <p class="mut" id="fwd"></p></section>
 <section class="card"><h3>Server</h3>
  <div class="row"><label>Name</label><input id="name" maxlength="40"></div>
  <div class="row"><label>Description</label><input id="desc" maxlength="300"></div>
  <div class="row"><label>Show in public list</label><select id="public"><option value="1">Yes</option><option value="0">No, code or address only</option></select></div>
  <div class="row"><label>Max players</label><input id="max" type="number" min="1" max="64"></div>
  <div class="row"><label>Password</label><input id="pass" type="password" placeholder="Leave blank to keep" maxlength="128"></div>
  <div class="row"><label></label><label style="flex:1;color:var(--tx)"><input type="checkbox" id="nopass"> No password (open to anyone)</label></div></section>
 <section class="card"><h3>Game rules</h3>
  <div class="row"><label>PvP</label><select id="r_pvp"><option value="off">Off</option><option value="zones">Only in marked zones</option><option value="on">On everywhere</option></select></div>
  <div class="row"><label>Friendly fire</label><select id="r_friendlyFire"><option value="false">Off</option><option value="true">On</option></select></div>
  <div class="row"><label>Difficulty</label><select id="r_difficulty"><option value="0.5">Easy</option><option value="1">Normal</option><option value="1.5">Hard</option><option value="2">Brutal</option></select></div>
  <div class="row"><label>XP</label><select id="r_xpMult"><option>0.5</option><option>1</option><option>2</option><option>3</option></select></div>
  <div class="row"><label>Loot</label><select id="r_lootMult"><option>0.5</option><option>1</option><option>2</option><option>3</option></select></div>
  <div class="row"><label>Paths allowed</label><select id="r_paths"><option value="both">Outlaw and Marshal</option><option value="outlaw">Outlaw only</option><option value="marshal">Marshal only</option></select></div>
  <div class="row"><label>Killing civilians</label><select id="r_civilians"><option value="true">Allowed</option><option value="false">Off</option></select></div>
  <div class="row"><label>Test gear</label><select id="r_devGear"><option value="false">Off</option><option value="true">Allowed</option></select></div></section>
 <section class="card"><h3>Lock player settings</h3><p class="mut">Locked settings are forced for everyone on this server. Players' own choices come back when they leave.</p>
  <div class="row"><label>Drugs and drinks</label><select id="l_subs"><option value="">Player's choice</option><option value="on">Locked on</option><option value="off">Locked off</option></select></div>
  <div class="row"><label>Story scenes</label><select id="l_cuts"><option value="">Player's choice</option><option value="on">Locked: always play</option><option value="off">Locked: always skip</option></select></div>
  <div style="margin-top:12px"><button class="go" id="save">Save settings</button></div></section>
 <section class="card"><h3>Players <span id="pc" class="mut"></span></h3><table id="pl"></table></section>
 <section class="card"><h3>Log</h3><div id="log"></div><p class="mut" id="res"></p></section>
</main><div id="toast"></div>
<script>
const T='__TOKEN__', $=id=>document.getElementById(id);
const api=(u,b)=>fetch('/admin/'+u,{method:'POST',headers:{'x-admin-token':T,'content-type':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json());
const toast=t=>{const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',1800)};
const copy=t=>{navigator.clipboard.writeText(t).then(()=>toast('Copied '+t),()=>toast(t))};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
let filled=false;
function fill(s){ $('name').value=s.name; $('desc').value=s.desc; $('public').value=s.public?'1':'0'; $('max').value=s.max; $('nopass').checked=!s.locked;
  for(const k in s.rules){const e=$('r_'+k); if(e) e.value=String(s.rules[k]);} const L=s.rules.locks||{}; $('l_subs').value=L.subs||''; $('l_cuts').value=L.cuts||''; }
async function tick(){ let s; try{ s=await api('status'); }catch(_){ document.body.classList.add('off'); $('sub').textContent='stopped'; return; }
  if(!filled){fill(s);filled=true;}
  $('sub').textContent=`${s.count}/${s.max} players · up ${Math.floor(s.uptime/60)} min · ${Math.round(s.mem/1048576)} MB`;
  $('code').textContent=s.code||'—'; $('codeBox').style.display=s.listed?'':'none';
  const rows=[['This PC','127.0.0.1:'+s.port]].concat(s.lan.map(ip=>['Same Wi-Fi',ip+':'+s.port])); if(s.publicIp) rows.push(['Internet (needs port forward)',s.publicIp+':'+s.port]);
  $('addrs').innerHTML=rows.map(([l,a])=>`<div class="addr"><span><span class="mut">${l}</span><br><code>${a}</code></span><button data-a="${a}">Copy</button></div>`).join('');
  $('addrs').querySelectorAll('button').forEach(b=>b.onclick=()=>copy(b.dataset.a));
  $('fwd').textContent=`Friends outside your home need port ${s.port} forwarded on your router to ${s.lan[0]||'this PC'}. Search "port forward" plus your router brand.`;
  $('pc').textContent=`${s.count}/${s.max}`;
  $('pl').innerHTML=s.list.length?s.list.map(p=>`<tr><td>${esc(p.nick)}</td><td class="mut">${esc(p.lv||'')}</td><td style="text-align:right"><button data-k="${p.id}">Kick</button> <button data-b="${p.id}">Ban</button></td></tr>`).join(''):'<tr><td class="mut">Nobody online yet.</td></tr>';
  $('pl').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>api('kick',{id:b.dataset.k}).then(tick));
  $('pl').querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{ if(confirm('Ban this player from your server?')) api('ban',{id:b.dataset.b}).then(tick); });
  const L=$('log'), atEnd=L.scrollTop+L.clientHeight>=L.scrollHeight-4; L.textContent=s.log.join('\n'); if(atEnd) L.scrollTop=L.scrollHeight; }
$('cpCode').onclick=()=>copy($('code').textContent);
$('save').onclick=async()=>{ const rules={pvp:$('r_pvp').value,friendlyFire:$('r_friendlyFire').value==='true',difficulty:+$('r_difficulty').value,xpMult:+$('r_xpMult').value,lootMult:+$('r_lootMult').value,paths:$('r_paths').value,civilians:$('r_civilians').value==='true',devGear:$('r_devGear').value==='true',locks:{subs:$('l_subs').value,cuts:$('l_cuts').value}};
  const b={name:$('name').value,desc:$('desc').value,public:$('public').value==='1',maxPlayers:+$('max').value,rules}; if($('nopass').checked) b.password=''; else if($('pass').value) b.password=$('pass').value;
  const r=await api('settings',b); $('pass').value=''; if(r.name!==b.name) toast('That name was blocked. Pick another.'); else toast('Saved'); filled=false; tick(); };
$('stop').onclick=()=>{ if(confirm('Stop the server? Everyone will be disconnected.')) api('stop').finally(()=>setTimeout(tick,800)); };
tick(); setInterval(tick,2000);
</script></body></html>
